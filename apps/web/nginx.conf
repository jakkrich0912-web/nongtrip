server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # หน้าเว็บกับ API อยู่ที่มาเดียวกัน คุกกี้เซสชันจึงไม่ต้องข้ามที่มา
  location /api/ {
    proxy_pass http://api:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # ใช้ IP ที่ต่อเข้ามาจริงเท่านั้น ห้ามต่อท้ายค่าที่ผู้ใช้ส่งมา: API เชื่อค่าแรกของ X-Forwarded-For
    # ถ้าต่อท้าย ($proxy_add_x_forwarded_for) ผู้ใช้ใส่ IP ปลอมเองแล้วหลบตัวจำกัดความถี่ของแชตได้
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    # แชตตอบเป็น SSE ต้องไม่พักข้อมูลไว้
    proxy_buffering off;
    proxy_read_timeout 120s;
  }

  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # หน้าเว็บเป็น single-page app: เส้นทางอื่นให้กลับไปที่ index.html
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }
}

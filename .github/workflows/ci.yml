name: ci

on:
  pull_request:
  push:
    branches: [main, develop]

jobs:
  structure:
    # ตรวจโครงโปรเจกต์ และกันความลับหลุดเข้า repo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Required files exist
        run: |
          for f in README.md .env.example docker-compose.yml docs/CONTRACT.md docs/SPEC.md docs/RUNBOOK.md docs/GIT_FLOW.md; do
            test -f "$f" || { echo "ขาดไฟล์ $f"; exit 1; }
          done
      - name: No secrets committed
        run: |
          if git ls-files | grep -E '(^|/)\.env$'; then echo ".env ถูก commit"; exit 1; fi

  test:
    # รันเทสต์ Python ของทุกบริการ ข้ามถ้ายังไม่มีเทสต์ (ช่วงตั้งโครง)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install and test
        run: |
          shopt -s nullglob
          reqs=(services/*/requirements.txt)
          if [ ${#reqs[@]} -eq 0 ]; then echo "ยังไม่มีบริการที่ติดตั้งได้ ข้าม"; exit 0; fi
          for r in "${reqs[@]}"; do pip install -r "$r"; done
          pip install pytest
          python -m pytest services -q

  web:
    # เทสต์และ build หน้าเว็บ
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Test
        run: npm test
      - name: Build
        run: npm run build

  docker:
    # build ภาพ Docker ทั้งสองตัว เปิดระบบทั้งชุดแล้วทดสอบเร็วผ่านหน้าเว็บ (nginx ส่งต่อไป API)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare env
        run: |
          cp .env.example .env
          sed -i 's/^OSM_LIVE=1/OSM_LIVE=0/; s/^SESSION_SECRET=$/SESSION_SECRET=ci-only-secret/; s/^ADMIN_EMAILS=$/ADMIN_EMAILS=e2e-admin@example.com/' .env
      - name: Up
        run: docker compose up -d --build --wait
      - name: Smoke test
        run: python3 scripts/smoke_test.py
      # เทสต์ใช้งานจริงผ่านเบราว์เซอร์กับระบบชุดเดียวกันที่เพิ่งเปิด (ดู e2e/README.md)
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Playwright
        working-directory: e2e
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: E2E (Playwright)
        working-directory: e2e
        env:
          E2E_BASE_URL: http://localhost:8080
          E2E_ADMIN_EMAIL: e2e-admin@example.com
        run: npx playwright test
      - name: E2E report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 7
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=200
      - name: Down
        if: always()
        run: docker compose down -v
